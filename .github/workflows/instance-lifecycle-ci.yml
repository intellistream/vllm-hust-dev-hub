name: Instance lifecycle control tests

on:
  push:
    branches: [main]
    paths: ['scripts/instance_control/**', 'scripts/instance_lifecycle.py', 'tests/test_instance*.py', 'tests/test_host*.py', '.github/workflows/instance-lifecycle-ci.yml']
  pull_request:
    paths: ['scripts/instance_control/**', 'scripts/instance_lifecycle.py', 'tests/test_instance*.py', 'tests/test_host*.py', '.github/workflows/instance-lifecycle-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest
      - name: Run CPU-only authority and lifecycle regressions
        run: python -m pytest -q tests/test_instance_lifecycle.py tests/test_instance_transactions.py tests/test_instance_control_transport.py tests/test_instance_foreground.py tests/test_host_authority.py tests/test_host_broker.py
